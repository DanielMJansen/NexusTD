<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nexus TD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap"
    />
  </head>
  <body>
    <div id="app">
      <header id="top-bar">
        <div id="brand"></div>
        <div id="menu-hud">
          <div class="chip" title="Essência: moeda permanente para talentos, criaturas, heróis e o Altar. Ganha a cada run (ondas, abates e vitória)"><span class="chip-icon essence-amount">✦</span><div class="chip-stack"><small class="chip-label">Essência</small><span id="menu-essence"></span></div></div>
          <div class="chip" id="menu-fragments-chip" title="Fragmentos de raça: caem a partir da Fase 2 e fortalecem criaturas no Santuário" hidden><span class="chip-icon fragment-amount">❖</span><div class="chip-stack"><small class="chip-label">Fragmentos</small><span id="menu-fragments"></span></div></div>
          <div class="chip" title="Onda mais alta que você já alcançou (inclui o Sem Fim)"><span class="chip-icon">☠</span><div class="chip-stack"><small class="chip-label">Melhor onda</small><span id="menu-best"></span></div></div>
          <div class="chip" title="Criaturas na sua coleção / total do jogo (desbloqueie mais na Coleção)"><span class="chip-icon">✦</span><div class="chip-stack"><small class="chip-label">Coleção</small><span id="menu-collection"></span></div></div>
          <div class="chip" title="Heróis desbloqueados / total (um por raça)"><span class="chip-icon">✪</span><div class="chip-stack"><small class="chip-label">Heróis</small><span id="menu-heroes"></span></div></div>
          <div class="chip" title="Runs vencidas / runs jogadas"><span class="chip-icon">♛</span><div class="chip-stack"><small class="chip-label">Vitórias</small><span id="menu-wins"></span></div></div>
        </div>
        <div id="hud">
          <div class="chip" title="Onda atual / total de ondas da fase"><span class="chip-icon">☠</span><div class="chip-stack"><small class="chip-label">Onda</small><span id="hud-wave"></span></div></div>
          <div class="chip gold" title="Ouro da run: invocar, evoluir, melhorar o Nexus"><span class="chip-icon">◉</span><div class="chip-stack"><small class="chip-label">Ouro</small><span id="hud-gold"></span></div></div>
          <div class="chip" title="Inimigos ainda vivos nesta onda (incluindo os que ainda vão entrar) / total da onda"><span class="chip-icon">☗</span><div class="chip-stack"><small class="chip-label">Inimigos vivos</small><span id="hud-enemies"></span></div></div>
        </div>
        <div class="top-buttons">
          <button id="pause-button" class="icon-button" type="button" title="Pausar (P / Esc)">❚❚</button>
          <button id="speed-button" class="icon-button" type="button" title="Velocidade do jogo (F) · 0 congela o tempo">1x</button>
          <button id="mute-button" class="icon-button" type="button" title="Silenciar">🔊</button>
          <button id="settings-button" class="icon-button" type="button" title="Configurações">⚙</button>
        </div>
      </header>
      <div id="layout">
        <main id="stage">
          <canvas id="arena"></canvas>
          <div id="hud-nexus-block">
            <div class="chip nexus" title="Vida do Nexus: se chegar a zero, a run acaba">
            <span class="chip-icon">◆</span>
            <div class="chip-stack"><small class="chip-label">Vida do Nexus</small><div class="bar"><div id="hud-nexus-bar"></div><span id="hud-nexus"></span></div></div>
          </div>
            <button id="nexus-button" type="button" title="Melhorias do Nexus com ouro (N ou clique no Nexus)"><span>◆ Melhorar</span><kbd>N</kbd></button>
            <div id="nexus-panel" hidden></div>
          </div>
          <div id="hud-bottom">
            <div id="hud-hero">
              <div class="chip hero-chip">
            <span class="chip-icon">✪</span>
            <div class="chip-stack">
              <small class="chip-label">Herói · <span id="hud-hero-level"></span></small>
              <div class="hero-bars">
                <div class="bar-hp"><div id="hud-hero-hp"></div><span id="hud-hero-hp-text"></span></div>
                <div class="bar-xp"><div id="hud-hero-xp"></div><span id="hud-hero-xp-text"></span></div>
              </div>
            </div>
            <div id="hero-sheet"></div>
          </div>
            </div>
            <div id="hud-creatures-block">
              <div class="hud-creatures-head" title="Criaturas em campo / limite de vagas (compre mais vagas entre ondas)">Criaturas <span id="hud-creatures"></span> · arraste ou aperte 1–8</div>
              <div id="card-list"></div>
            </div>
            <button id="pulse-button" type="button">
              <span class="tooltip pulse-tooltip"></span>
              <span class="pulse-fill"></span>
              <span class="pulse-label"><b>Pulso</b><small id="pulse-status"></small></span>
              <kbd>Espaço</kbd>
            </button>
          </div>
          <div id="freeze-badge" hidden>❄ Tempo parado · F ou 0 para voltar</div>
          <div id="creature-popup" hidden></div>
          <canvas id="minimap" hidden title="Minimapa: clique para mover a vista · C volta ao herói"></canvas>
          <div id="overlay"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
