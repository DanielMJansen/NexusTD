function update(dt){
 if(S.ph!='play')return;

 for(const e of S.en){if(e.dead)continue;e.sl-=dt;const k=e.sl>0?.5:1,dx=NX-e.x,dy=NY-e.y,L=Math.hypot(dx,dy);

 for(const f of S.ft){f.t-=dt;f.y-=22*dt}S.ft=S.ft.filter(f=>f.t>0);
 for(const p of S.ps){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}

}

 if(k=='H'){f('#4a5a86',()=>{L(0,-8,11,13);x.lineTo(-11,13)});f('#e8d3b8',()=>o(0,-10,5));x.strokeStyle='#cfe';x.lineWidth=2;x.beginPath();L(9,2,15,-12);x.stroke()}

 else if(k=='D'||k=='G'){const c=k=='D'?['#d4521a','#ffb040']:['#3a8fd0','#bdf'];f(c[0],()=>{L(-3,-4,-20,-14+w*3);x.lineTo(-10,6);x.lineTo(10,6);x.lineTo(20,-14+w*3);x.lineTo(3,-4)});f(c[0],()=>x.ellipse(0,2,8,10,0,0,7));f(c[1],()=>o(0,-10,6));f('#fff',()=>{o(-2,-11,1.3);o(2,-11,1.3)})}
 else if(k=='b'){x.strokeStyle='#5c8a4a';x.lineWidth=3;x.beginPath();L(-6,0,-15,-3+w*2);L(6,0,15,-3+w*2);x.stroke();f('#5c8a4a',()=>x.ellipse(0,2,8,10,0,0,7));f('#7ba862',()=>o(0,-9,6));f('#000',()=>{o(-2,-10,1.2);o(2,-10,1.2)})}

 else{f(k=='k'?'#6b2a2a':'#8a5a3a',()=>x.ellipse(0,3,12,13,0,0,7));f('#a87a52',()=>o(0,-9,8));f('#ddd',()=>{L(-8,-14,-11,-22);x.lineTo(-4,-15);L(8,-14,11,-22);x.lineTo(4,-15)});f('#ff0',()=>{o(-3,-10,1.5);o(3,-10,1.5)});if(k=='k')f('#fc3',()=>{L(-8,-18,-5,-26);x.lineTo(0,-19);x.lineTo(5,-26);x.lineTo(8,-18)})}
 x.restore()}
const TB=Array.from({length:14},()=>[Math.random()*W,Math.random()*H]).filter(s=>Math.hypot(s[0]-NX,s[1]-NY)>70);
function draw(){x=mx;const t=performance.now()/1000;
 const g=x.createRadialGradient(NX,NY,20,NX,NY,300);g.addColorStop(0,'#2a1c4a');g.addColorStop(1,'#07050f');x.fillStyle=g;x.fillRect(0,0,W,H);

 const pu=1+Math.sin(t*3)*.08;x.save();x.translate(NX,NY);x.shadowColor='#b36bff';x.shadowBlur=30;x.fillStyle='#8a4fff';x.beginPath();x.moveTo(0,-24*pu);x.lineTo(14,0);x.lineTo(0,24*pu);x.lineTo(-14,0);x.fill();x.fillStyle='#dcbfff';x.beginPath();x.moveTo(0,-24*pu);x.lineTo(14,0);x.lineTo(0,5);x.fill();x.restore();
 x.fillStyle='#000a';x.fillRect(NX-24,NY-38,48,6);x.fillStyle=S.hp/S.mx>.3?'#4d8':'#e44';x.fillRect(NX-24,NY-38,48*Math.max(0,S.hp/S.mx),6);
 for(const e of S.en){shade(e.x,e.y,10*e.sc);if(e.sl>0){x.shadowColor='#6cf';x.shadowBlur=14}spr(e.k,e.x,e.y,e.sc,t+e.ph);x.shadowBlur=0;if(e.hp<e.mh){const w=18*e.sc;x.fillStyle='#000a';x.fillRect(e.x-w/2,e.y-e.r-12,w,3);x.fillStyle='#e44';x.fillRect(e.x-w/2,e.y-e.r-12,w*Math.max(0,e.hp/e.mh),3)}}

 if(S.pk){const c=S.pk;x.strokeStyle='#fff6';x.beginPath();x.arc(c.x,c.y,T[c.k].R*S.m.r,0,7);x.stroke();x.fillStyle='#3a2b60';x.fillRect(c.x-32,c.y-46,64,22);x.strokeStyle='#fc6';x.strokeRect(c.x-32,c.y-46,64,22);x.fillStyle='#fc6';x.font='bold 11px Georgia';x.textAlign='center';x.fillText('Vender +'+Math.round(c.paid*.6),c.x,c.y-31)}
 const hr=S.hr;if(Math.hypot(hr.tx-hr.x,hr.ty-hr.y)>6){x.strokeStyle='#8cf8';x.beginPath();x.arc(hr.tx,hr.ty,6,0,7);x.stroke()}

 if(S.drag&&S.sel){const[p,q]=S.mp,k=S.sel,R=T[k].R*S.m.r;x.fillStyle=T[k].c+'22';dot(p,q,R);x.strokeStyle=T[k].c;x.beginPath();x.arc(p,q,R,0,7);x.stroke();x.globalAlpha=.7;spr(k,p,q,1.1,t);x.globalAlpha=1}
 for(const f of S.fx){if(f.ring){x.strokeStyle='#b36bff';x.lineWidth=3;x.beginPath();x.arc(f.x,f.y,95*(1-f.t/.3),0,7);x.stroke();x.lineWidth=1;continue}
  const p=1-f.t/f.u,X=f.a+(f.c-f.a)*p,Y=f.b+(f.d-f.b)*p;
  if(f.k=='A'){x.strokeStyle='#ffe9a8';x.lineWidth=2;x.beginPath();x.moveTo(X,Y);x.lineTo(X-(f.c-f.a)*.15,Y-(f.d-f.b)*.15);x.stroke()}

  else{x.strokeStyle=f.k=='V'?'#f33':'#fff';x.lineWidth=3;x.beginPath();x.arc(f.c,f.d,10,p*3,p*3+2);x.stroke()}x.lineWidth=1}
 for(const p of S.ps){x.globalAlpha=p.t*2;x.fillStyle=p.c;dot(p.x,p.y,2.5)}x.globalAlpha=1;
 x.font='bold 12px Georgia';x.textAlign='center';for(const f of S.ft){x.globalAlpha=Math.min(1,f.t*2);x.fillStyle=f.c;x.fillText(f.s,f.x,f.y)}x.globalAlpha=1;
 document.getElementById('h').textContent=`Onda ${Math.max(1,S.wave)}/10 · 💰 ${S.gold} · Nexus ${Math.max(0,S.hp|0)}/${S.mx} · ${S.cr.length}/${LIM}`;
 for(const k in T){const e=CD[k],u=S.un[k];e.disabled=!u;e.style.display=u?'':'none';e.className=S.sel==k?'on':'';e.children[1].textContent=T[k].n;e.children[2].textContent=u?cost(k)+'💰':'🔒 '+T[k].r;const cx=e.children[0].getContext('2d');cx.clearRect(0,0,48,44);x=cx;spr(k,24,26,1.1,t);x=mx}
